server:
  port: 8080

spring:
  profiles:
    #多环境
    active: dev
    #多环境
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${merchant.datasource.driver-class-name}
      url: jdbc:mysql://${merchant.datasource.host}:${merchant.datasource.port}/${merchant.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${merchant.datasource.username}
      password: ${merchant.datasource.password}
  redis:
    host: ${merchant.redis.host}
    port: ${merchant.redis.port}
    password: ${merchant.redis.password}
    database: ${merchant.redis.database}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.shareeat.merchant.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com.shareeat.merchant:
      mapper: debug
      service: info
      controller: info

merchant:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: shareeat-admin
    # 设置jwt过期时间
    admin-ttl: 604800000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    #用户端
    user-secret-key: wyouygmeng
    user-ttl: 604800000
    user--token-name: authentication

  alioss:
    endpoint: ${merchant.alioss.endpoint}
    access_key_id: ${merchant.alioss.access_key_id}
    access_key_secret: ${merchant.alioss.access_key_secret}
    bucket_name: ${merchant.alioss.bucket_name}

  wechat:
    appid: ${merchant.wechat.appid}
    secret: ${merchant.wechat.secret}

my:
  upload:
    local-path: E:/JAVA tools/imagesUrl/

cnm:
